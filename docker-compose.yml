services:
  nginx-proxy:
    image: ghcr.io/diegobianchetti/nginx-proxy:${NGINX_TAG:-latest}
    container_name: ${CONTAINERNAME:-nginx-proxy}
    hostname: ${HOSTNAME:-nginx-proxy}
    restart: unless-stopped
    cap_add:
      - NET_RAW
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./sites-available:/etc/nginx/sites-available
      - ./sites-enabled:/etc/nginx/sites-enabled
      - /etc/nginx-proxy/vhosts.d:/etc/nginx/conf.d/vhosts:ro
      - letsencrypt:/etc/letsencrypt/
      - log:/var/log/nginx
    deploy:
      resources:
        limits:
          memory: ${NGINX_MEMORY_LIMIT:-512M}
          cpus: "${NGINX_CPU_LIMIT:-1}"
    networks:
      - nginx-proxy-network

networks:
  nginx-proxy-network:
    name: nginx-proxy-network
    driver: bridge
    ipam:
      config:
        - subnet: ${COMPOSE_PROJECT_SUBNET:-172.31.0.0/28}

volumes:
  letsencrypt:
  log:
