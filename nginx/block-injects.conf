# block-injects.conf — Proteção contra ataques de injeção e exploits comuns
#
# Uso em cada server block:
#   if ($block_uri_pattern) { return 444; }
#   if ($block_ip)          { return 444; }

# geo: override por IP — permite whitelisting de redes internas
# default 0 = nenhum bloqueio por IP por padrão
geo $block_ip {
    default 0;
    # Exemplos de bloqueio por range de IP:
    # 198.51.100.0/24 1;
    # 203.0.113.0/24  1;
}

# map: detecta padrões maliciosos na URI e query string
# Grupos de regex são intencionalmente não-capturantes (?:...)
# para eliminar variáveis de captura e reduzir a superfície de ataque
# (CVE-2026-42533 — map directive com regex matching + capturas expostas).
map $request_uri $block_uri_pattern {
    default 0;

    # SQL Injection — palavras-chave SQL em URIs e query strings
    "~*(?:\bunion\b.+\bselect\b|\binsert\b.+\binto\b|\bdelete\b.+\bfrom\b)" 1;
    "~*(?:\bdrop\b.+\btable\b|\bexec\b.+\(|\bcast\b.+\()"                   1;
    "~*(?:--|%27|%22).*(?:union|select|insert|delete|drop|update)"             1;

    # Injeção de arquivos — path traversal e wrappers de protocolo PHP
    "~*(?:\.\.\/|\.\.\\\\|%2e%2e%2f|%252e%252e%252f)"               1;
    "~*(?:\/etc\/passwd|\/etc\/shadow|\/proc\/self|\/var\/www\/)"    1;
    "~*(?:php://|data://|expect://|zip://|phar://)"                  1;

    # Acesso a arquivos sensíveis
    "~*\.(?:git|svn|env|bak|sql|ini|key|pem|p12|pfx)$" 1;

    # Exploits e injeções de código remoto (RCE)
    "~*(?:eval\(|base64_decode\(|system\(|passthru\(|shell_exec\()" 1;
    "~*(?:<script|javascript:|vbscript:|on(?:load|error|click)=)"     1;

    # Scanners e painéis de administração expostos
    "~*(?:\/wp-admin|\/wp-login\.php|\/xmlrpc\.php|\/\.env$)"         1;
    "~*(?:\/phpmyadmin|\/pma\/|\/adminer\.php|\/manager\/html)"       1;
}
