# error-pages.conf — snippet para inclusão dentro de server blocks
# Uso: adicionar em cada server block que deve exibir páginas de erro customizadas:
#   include /etc/nginx/conf.d/error-pages.conf;

include /etc/nginx/error-pages/error-pages-content.conf;

location ^~ /error-pages/styles/ {
    root /etc/nginx/error-pages;
    allow all;
}

location ~ "/(4[0-9]{2}|5[0-9]{2})\.html" {
    root /etc/nginx/error-pages;
    sub_filter '%{HOSTNAME}' $host;
    sub_filter_once off;
    allow all;
    internal;
}
