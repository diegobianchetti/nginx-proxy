# default.conf — vhost catch-all para requisições sem ServerName correspondente
# Retorna 444 (sem resposta) — evita expor a infraestrutura a scanners e bots

server {
    listen 80 default_server;
    server_name _;
    return 444;
    access_log /var/log/nginx/access-default.log;
}

server {
    listen 443 ssl default_server;
    server_name _;

    # Certificado self-signed gerado em runtime pelo entrypoint.sh
    ssl_certificate     /etc/nginx/ssl/default.crt;
    ssl_certificate_key /etc/nginx/ssl/default.key;

    return 444;
    access_log /var/log/nginx/access-default.log;
}
