user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # TLS — apenas versões modernas (TLSv1 e TLSv1.1 removidos: deprecated por RFC 8996)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Compressão gzip
    gzip on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        font/woff
        font/woff2
        image/svg+xml;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Proteção (map/geo — válidos no contexto http)
    include /etc/nginx/conf.d/block-injects.conf;

    # Vhost default (catch-all com return 444)
    include /etc/nginx/conf.d/default.conf;

    # Vhosts de projetos gerados pelo cctl
    include /etc/nginx/conf.d/vhosts/*.conf;

    # Sites gerenciados manualmente
    include /etc/nginx/sites-enabled/*;

    # error-pages.conf contém diretivas location — deve ser incluído
    # dentro de cada server block com:
    #   include /etc/nginx/conf.d/error-pages.conf;
}
